name: lab10_transactions
services:
  mongo1:
    image: mongo:7.0
    hostname: mongo1
    command: ["mongod", "--replSet", "rs10", "--bind_ip_all"]
    ports: ["127.0.0.1:27417:27017"]
    volumes: ["mongo1data:/data/db"]
    networks: ["lab10net"]
  mongo2:
    image: mongo:7.0
    hostname: mongo2
    command: ["mongod", "--replSet", "rs10", "--bind_ip_all"]
    volumes: ["mongo2data:/data/db"]
    networks: ["lab10net"]
  mongo3:
    image: mongo:7.0
    hostname: mongo3
    command: ["mongod", "--replSet", "rs10", "--bind_ip_all"]
    volumes: ["mongo3data:/data/db"]
    networks: ["lab10net"]
  labrunner:
    profiles: ["runner"]
    image: ${LAB10_IMAGE:-lab10-mongodb-assessment:latest}
    build: .
    working_dir: /app
    volumes: ["./output:/app/output", "./01_Lab_10_1:/app/01_Lab_10_1", "./02_Activity_10_1_Try_It_Yourself:/app/02_Activity_10_1_Try_It_Yourself", "./03_Lab_10_2:/app/03_Lab_10_2", "./04_Activity_10_2_Try_It_Yourself:/app/04_Activity_10_2_Try_It_Yourself"]
    environment: ["MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs10", "MONGO_DB=lab10"]
    networks: ["lab10net"]
networks:
  lab10net:
volumes:
  mongo1data:
  mongo2data:
  mongo3data:
