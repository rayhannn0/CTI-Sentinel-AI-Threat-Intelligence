apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo-headless-svc
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: prepare-keyfile
          image: busybox:1.36
          command: ["sh", "-ec", "cp /secret/keyfile /work/keyfile; chmod 0400 /work/keyfile; chown 999:999 /work/keyfile"]
          volumeMounts:
            - name: mongo-key-secret
              mountPath: /secret
              readOnly: true
            - name: keyfile-work
              mountPath: /work
      containers:
        - name: mongod
          image: mongo:7.0
          command: ["mongod"]
          args: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/work/keyfile"]
          ports:
            - containerPort: 27017
              name: mongodb
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-work
              mountPath: /work
              readOnly: true
      volumes:
        - name: mongo-key-secret
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
        - name: keyfile-work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
