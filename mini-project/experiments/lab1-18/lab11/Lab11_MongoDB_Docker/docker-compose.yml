name: lab11_sharding
services:
  config1:
    image: mongo:7.0
    command: ["mongod","--configsvr","--replSet","cfg11","--bind_ip_all","--port","27019"]
    volumes: ["cfgdata:/data/db"]
    networks: [lab11net]
  shard1:
    image: mongo:7.0
    command: ["mongod","--shardsvr","--replSet","shard11a","--bind_ip_all","--port","27017"]
    volumes: ["shard1data:/data/db"]
    networks: [lab11net]
  shard2:
    image: mongo:7.0
    command: ["mongod","--shardsvr","--replSet","shard11b","--bind_ip_all","--port","27017"]
    volumes: ["shard2data:/data/db"]
    networks: [lab11net]
  mongos:
    image: mongo:7.0
    depends_on: [config1,shard1,shard2]
    command: ["mongos","--configdb","cfg11/config1:27019","--bind_ip_all","--port","27017"]
    ports: ["27517:27017"]
    networks: [lab11net]
  labrunner:
    profiles: [runner]
    build: .
    image: lab11-mongodb-assessment:latest
    depends_on: [mongos]
    environment: ["MONGO_URI=mongodb://mongos:27017/?directConnection=true"]
    volumes: ["./output:/app/output"]
    networks: [lab11net]
networks:
  lab11net: {}
volumes:
  cfgdata: {}
  shard1data: {}
  shard2data: {}
