name: lab18_threat
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27021:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 30
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: Lab18
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 45
      start_period: 40s
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/lab18securepassword
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p lab18securepassword 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 35
  app:
    build: .
    command: ["sleep", "infinity"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      CASSANDRA_HOST: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lab18securepassword
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./output:/workspace/output
    depends_on:
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
